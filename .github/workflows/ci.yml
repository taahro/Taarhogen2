name: TAARHOGEN2 CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile source
        run: python -m compileall -q taarhogen2 scripts
      - name: Test project and VOID hardware preflight
        run: python -m pytest -q
